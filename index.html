<!DOCTYPE html>
<html lang="es">

<head>

    <!-- ============================================================
         CONFIGURACIÓN GENERAL
         ============================================================ -->

    <meta charset="UTF-8">

    <!--
        Hace que el juego se adapte correctamente a celulares,
        tablets y computadores.
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- ============================================================
         INFORMACIÓN DEL SITIO
         ============================================================ -->

    <title>2048 Infinite</title>

    <meta
        name="description"
        content="2048 Infinite - Juego de 2048 con niveles infinitos, progreso y ranking."
    >

    <!-- ============================================================
         ESTILOS
         ============================================================ -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ============================================================
         APLICACIÓN PRINCIPAL
         ============================================================ -->

    <div id="app">


        <!-- ========================================================
             ENCABEZADO
             ======================================================== -->

        <header class="game-header">

            <!-- Título -->
            <div class="header-title">

                <h1 class="game-title">
                    2048 Infinite
                </h1>

                <p class="game-subtitle">
                    Niveles infinitos
                </p>

            </div>


            <!-- Información del jugador -->
            <div class="player-info">

                <span class="player-label">
                    Jugador
                </span>

                <span
                    id="player-name"
                    class="player-name"
                >
                    Invitado
                </span>

            </div>

        </header>


        <!-- ========================================================
             INFORMACIÓN DE LA PARTIDA
             ======================================================== -->

        <section class="game-info">

            <!-- Nivel -->
            <div class="info-card">

                <span class="info-label">
                    Nivel
                </span>

                <strong
                    id="current-level"
                    class="info-value"
                >
                    1
                </strong>

            </div>


            <!-- Puntuación -->
            <div class="info-card">

                <span class="info-label">
                    Puntuación
                </span>

                <strong
                    id="current-score"
                    class="info-value"
                >
                    0
                </strong>

            </div>


            <!-- Mejor puntuación -->
            <div class="info-card">

                <span class="info-label">
                    Mejor
                </span>

                <strong
                    id="best-score"
                    class="info-value"
                >
                    0
                </strong>

            </div>

        </section>


        <!-- ========================================================
             TABLERO
             ======================================================== -->

        <main class="game-container">

            <!--
                Este será nuestro tablero 4x4.

                Posteriormente JavaScript generará las fichas
                dinámicamente dentro de este elemento.
            -->
            <div
                id="game-board"
                class="game-board"
                aria-label="Tablero de juego 2048"
            >

                <!-- =================================================
                     FILA 1
                     ================================================= -->

                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>


                <!-- =================================================
                     FILA 2
                     ================================================= -->

                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>


                <!-- =================================================
                     FILA 3
                     ================================================= -->

                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>


                <!-- =================================================
                     FILA 4
                     ================================================= -->

                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>
                <div class="tile"></div>

            </div>


            <!-- ====================================================
                 CONTROLES
                 ==================================================== -->

            <p class="controls-hint">

                🖥️ PC:
                utiliza las
                <strong>flechas del teclado</strong>

                <br>

                📱 Móvil:
                desliza el dedo sobre el tablero

            </p>

        </main>


        <!-- ========================================================
             BOTONES PRINCIPALES
             ======================================================== -->

        <section class="game-actions">

            <button
                id="new-game-button"
                class="primary-button"
                type="button"
            >
                Nueva partida
            </button>

            <button
                id="levels-button"
                class="secondary-button"
                type="button"
            >
                Niveles
            </button>

            <button
                id="ranking-button"
                class="secondary-button"
                type="button"
            >
                Ranking
            </button>

        </section>


        <!-- ========================================================
             INFORMACIÓN DEL NIVEL
             ======================================================== -->

        <section class="level-progress">

            <div class="level-progress-header">

                <span>
                    Progreso del nivel
                </span>

                <strong id="level-progress-text">
                    0%
                </strong>

            </div>


            <div class="progress-bar">

                <div
                    id="level-progress-fill"
                    class="progress-fill"
                ></div>

            </div>

        </section>


        <!-- ========================================================
             PIE DE PÁGINA
             ======================================================== -->

        <footer class="game-footer">

            <p>
                2048 Infinite
            </p>

            <p>
                Sistema de niveles infinitos
            </p>

        </footer>


    </div>


    <!-- ============================================================
         JAVASCRIPT
         ============================================================ -->

    <script
        type="module"
        src="js/game.js"
    ></script>

    <script
        type="module"
        src="js/supabase.js"
    ></script>

</body>

</html>
